name: Check website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build and index search
        run: npm run build
      - name: Verify generated pages and local URLs
        run: npm run verify:build
      - name: Verify a GitHub Pages base path
        env:
          BASE_PATH: /website
        run: |
          npm run build
          npm run verify:build
